name: FG Preview Windows build
on:
  push:
    branches: [feature/frame-generation-preview]
  workflow_dispatch:
    inputs:
      publish_preview:
        description: Publish FG Preview 0.3 after successful checks and build
        required: true
        default: false
        type: boolean
permissions:
  contents: read
jobs:
  portable:
    if: github.repository == 'ygyp57pxkf-cloud/dlss-swapper'
    runs-on: windows-2025
    permissions:
      contents: write
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Test install and recovery behavior
        run: dotnet run --project tests/FrameGeneration/FrameGeneration.Tests.csproj
      - name: Test external tool preparation and game inspection
        run: dotnet run --project tests/EnhancementTools/EnhancementTools.Tests.csproj
      - name: Build Windows x64 portable
        run: dotnet publish "src/DLSS Swapper.csproj" --runtime win-x64 --self-contained --configuration Release_Portable -p:PublishDir=bin/publish/portable/
      - name: Package preview
        shell: pwsh
        run: |
          $publish = 'src/bin/publish/portable'
          (Get-Content README.md -Raw).Replace('(docs/Enhancement-Tools.md)', '(Enhancement-Tools.md)').Replace('(docs/README.upstream.md)', '(https://github.com/ygyp57pxkf-cloud/dlss-swapper/blob/feature/frame-generation-preview/docs/README.upstream.md)') | Set-Content "$publish/README-FG-Preview.md"
          Copy-Item LICENSE "$publish/LICENSE"
          Copy-Item docs/Enhancement-Tools.md "$publish/Enhancement-Tools.md"
          @{ commit = (git rev-parse HEAD); version = 'FG Preview 0.3'; backendCommit = '1fb9ecbd980b1f191c092dce1b072b3cb9bd8984'; optionalBackendCommit = '5f62ff44a9c08f9841fa605e7b7160f79ccd2c40'; gameTool = 'DLSS5-Swapper 2.2.7 (on demand)'; mediaTool = 'Visual Enhancer 8.0 (on demand)'; gpuValidation = 'pending user gameplay and media tests' } | ConvertTo-Json | Set-Content "$publish/FG-Preview-build.json"
          Compress-Archive -Path "$publish/*" -DestinationPath DLSS-Swapper-FG-Preview-0.3-win-x64.zip
      - name: Verify portable package
        shell: pwsh
        run: |
          $archive = [IO.Compression.ZipFile]::OpenRead("$pwd/DLSS-Swapper-FG-Preview-0.3-win-x64.zip")
          try {
            foreach ($name in @('DLSS Swapper.exe', 'README-FG-Preview.md', 'Enhancement-Tools.md', 'FG-Preview-build.json')) {
              if (-not $archive.GetEntry($name)) { throw "Missing packaged file: $name" }
            }
            $reader = [IO.BinaryReader]::new([IO.File]::OpenRead("$pwd/src/bin/publish/portable/DLSS Swapper.exe"))
            try {
              $reader.BaseStream.Position = 0x3c
              $offset = $reader.ReadInt32()
              $reader.BaseStream.Position = $offset + 4
              if ($reader.ReadUInt16() -ne 0x8664) { throw 'Portable EXE is not x64' }
            } finally { $reader.Dispose() }
          } finally { $archive.Dispose() }
      - uses: actions/upload-artifact@v4
        with:
          name: DLSS-Swapper-FG-Preview-0.3-win-x64
          path: DLSS-Swapper-FG-Preview-0.3-win-x64.zip
          if-no-files-found: error
      - name: Publish requested prerelease
        if: github.event_name == 'workflow_dispatch' && inputs.publish_preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create fg-preview-0.3 DLSS-Swapper-FG-Preview-0.3-win-x64.zip --target ${{ github.sha }} --title "DLSS Swapper FG Preview 0.3" --prerelease --notes-file docs/Release-0.3.md
